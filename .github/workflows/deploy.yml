name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  # Triggered remotely when a post is published from the admin panel
  # (via the trigger-deploy Supabase Edge Function)
  workflow_dispatch:

# One deploy at a time, in order. Without this, two merges in a row raced and
# the older build finished last, putting stale content live. Queued runs are
# not cancelled mid-deploy; only the newest pending run is kept.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Set the repo variable ASK_ME_ENABLED=true once the ask-me Edge
          # Function is deployed with its GEMINI_API_KEY secret.
          NEXT_PUBLIC_ASK_ME_ENABLED: ${{ vars.ASK_ME_ENABLED }}
          # Set the repo variable COMMENTS_ENABLED=true once the blog-comments
          # Edge Function and its migration are deployed.
          NEXT_PUBLIC_COMMENTS_ENABLED: ${{ vars.COMMENTS_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
