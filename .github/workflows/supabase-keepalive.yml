name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without activity. A paused
# project makes the static build fail (no blog slugs for generateStaticParams)
# and takes the blog, comments and Ask Me offline. One read every few days
# keeps it awake.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query published posts
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/blogs?select=slug&status=eq.published&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase unreachable (HTTP $code) — is the project paused? Restore it in the Supabase dashboard."
            exit 1
          fi
